name: "Set up macOS build"
description: >-
  The shared step sequence of every macOS CI job after checkout: the Xcode
  selection, the Swift toolchain identity probe, and the SwiftPM dependency
  cache restore. The macos-26 runner image carries several Xcode 26.x
  releases, and its default can move on an image roll, so the first step
  selects one by path.

  GitHub Actions constraint: a local action resolves from the workspace, so
  the calling job MUST run actions/checkout before this action. Checkout
  cannot live inside it.

runs:
  using: "composite"
  steps:
    # Xcode 26.6 bundles Swift 6.3.3, the version the Linux container pin in
    # ci.yml names. Bump this path and that pin together.
    - name: Select Xcode
      shell: bash
      run: |
        set -euo pipefail
        sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
        xcodebuild -version

    - name: Record Swift toolchain identity
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        VERSION="$(swift --version | grep -oE 'Swift version [0-9]+(\.[0-9]+)+' | head -n1 | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n1)"
        if [[ -z "${VERSION}" ]]; then
          echo "could not read a Swift marketing version from 'swift --version'" >&2
          swift --version >&2 || true
          exit 1
        fi
        # The marketing version alone is not a toolchain identity: Xcode
        # 26.5 -> 26.6 can ship a different swiftlang build and SDK under the
        # same Swift banner, and hosted image rolls are silent. Hash
        # the full build identity — every line of `swift --version` plus
        # `xcodebuild -version` (which carries the Xcode build number) — and
        # append a short digest to the key. The marketing version stays in
        # the key for legibility only.
        ID="$( { swift --version; xcodebuild -version; } | shasum -a 256 | cut -c1-12 )"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "id=${ID}" >> "$GITHUB_OUTPUT"

    - name: Restore SwiftPM dependency cache
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.id }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.id }}-spm-

    - name: Print toolchain versions
      shell: bash
      run: |
        xcodebuild -version
        swift --version
