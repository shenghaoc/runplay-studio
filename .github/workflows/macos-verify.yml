name: macOS verification

# Reusable macOS verification body, called by every lane so they can never
# drift apart:
#   - ci.yml      calls it once per PR when a changed path can reach macOS,
#                 with the selector's test filter (engine + full-stack tests)
#   - nightly.yml calls it with only the release compile (the rest of its
#                 macOS work comes through ci.yml)
#   - release.yml calls it with every suite enabled before packaging
# Not triggered directly by any event.
#
# GitHub Actions constraint: a job that `uses:` a reusable workflow can
# declare only `name`, `uses`, `with`, `needs`, `if`, `permissions`,
# `strategy`, `concurrency`, and `secrets` — it cannot also have `steps`.
# That is why the callers are bare `uses:` jobs and why the suite toggles
# below exist: the caller selects work, this workflow owns the step
# sequence.

on:
  workflow_call:
    inputs:
      engine:
        description: >-
          Build the Swift engine target on its own. Its tests run in the full
          suite; with `full-tests` off this also runs them on their own.
        type: boolean
        default: true
      full-tests:
        description: "Run the full package test suite (swift test)."
        type: boolean
        default: true
      release-compile:
        description: "Compile every test target in release configuration."
        type: boolean
        default: false
      localization:
        description: "Check the String Catalogs against the source (scripts/check-localization.sh)."
        type: boolean
        default: false
      boundaries:
        description: >-
          Scan every Swift source for engine imports on this runner. The PR
          lane and the nightly run the scan once, on Linux (ci.yml); only the
          release path sets this, so a release still validates the
          boundaries. The macOS target graph is checked on every run.
        type: boolean
        default: false
      test-filter:
        description: >-
          A `swift test --filter` regex that narrows the full-tests run; empty
          runs every test target. The whole package is built either way.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Verify (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # A local action resolves from the workspace, so checkout must precede
      # the setup composite.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-macos-build

      # The engine boundary validator checks two things. Its target-graph
      # check is the one only macOS can make: the SwiftPM graph on Linux omits
      # RunPlayPlatform and RunPlayStudio (they exist only under
      # `#if os(macOS)`), so a forbidden RunPlayEngine dependency added to
      # either would be invisible there, and a source scan misses a manifest
      # edge without an import. It parses the manifest only and takes seconds,
      # so it runs on every call. The source scan is a static check that
      # ci.yml runs on Linux; only the release path asks for it here.
      - name: Validate the engine target graph (macOS targets)
        if: ${{ !inputs.boundaries }}
        run: python3 scripts/validate-swift-engine-boundaries.py --graph-only
      - name: Validate Swift engine boundaries
        if: inputs.boundaries
        run: python3 scripts/validate-swift-engine-boundaries.py

      # The Linux Core gate's log parser and the SwiftPM crash-retry
      # classifier it runs `swift test` through are shell + awk. The Linux
      # lane self-tests both on the image's mawk before trusting them; this
      # runs the same fixtures on BSD awk, which is what the docker/podman
      # modes parse with on a developer's Mac. /bin/bash pins the bash 3.2
      # every Mac ships, whatever bash comes first on PATH. Seconds, no
      # Swift build.
      - name: Self-test Linux log parsers (BSD awk, bash 3.2)
        run: |
          /bin/bash ./scripts/linux-container-verify.sh --self-test
          /bin/bash ./scripts/retry-swiftpm-libdispatch-crash.sh --self-test

      # Every SwiftPM build and test call below passes --build-system swiftbuild.
      # Swift 6.3.x (Xcode 26.6) builds with its native build system by default,
      # which copies a String Catalog uncompiled: no .lproj folders and no plural
      # forms, so the localization tests fail. swift-build compiles the catalogs
      # and is the default from Swift 6.4. A `swift test --skip-build` must use
      # the build system that built.
      - name: Build RunPlayEngine
        if: inputs.engine
        run: swift build --build-system swiftbuild --target RunPlayEngine

      # The "Run tests" step already runs the engine tests, so the separate
      # run is needed only when the full suite is off.
      - name: Run Swift engine tests
        if: inputs.engine && !inputs.full-tests
        run: swift test --build-system swiftbuild --filter RunPlayEngineTests

      # Build and test are separate steps so the logs show where the time
      # goes. Studio depends on every module upstream, so the whole package
      # builds on every run; only the tests that run are narrowed.
      #
      # With `localization` on, this same build also extracts the localizable
      # strings (-emit-localized-strings into ${RUNNER_TEMP}/stringsdata), so
      # the String Catalogs check below reads this build's extraction instead
      # of compiling the package a second time. The flag only adds
      # .stringsdata outputs: the same targets build with the same warnings
      # and the same tests (compared locally against a build without it).
      - name: Build all targets and tests
        if: inputs.full-tests
        env:
          LOCALIZATION: ${{ inputs.localization }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${LOCALIZATION}" == "true" ]]; then
            flags+=(-Xswiftc -emit-localized-strings -Xswiftc -emit-localized-strings-path -Xswiftc "${RUNNER_TEMP}/stringsdata")
            mkdir -p "${RUNNER_TEMP}/stringsdata"
          fi
          swift build --build-system swiftbuild --build-tests "${flags[@]+"${flags[@]}"}"

      - name: Run tests
        if: inputs.full-tests
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          RUNPLAY_SNAPSHOT_FAILURES_DIR: ${{ runner.temp }}/snapshot-failures
        run: |
          set -euo pipefail
          if [[ -n "${TEST_FILTER}" ]]; then
            swift test --build-system swiftbuild --skip-build --filter "${TEST_FILTER}"
          else
            swift test --build-system swiftbuild --skip-build
          fi

      # A failing image snapshot (SnapshotAssertion) writes its actual render
      # and a diff image there; without them a difference that appears only
      # on the runner could not be inspected. One call per workflow run sets
      # full-tests, so the name only needs the attempt.
      - name: Upload snapshot failures
        if: failure() && inputs.full-tests
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore
          retention-days: 7

      # Release-mode compile check for every test target. Benchmark scripts
      # build tests in release, but no other suite compiles the test targets
      # in that configuration, so DEBUG-only test helpers (e.g. #101's
      # synthetic map preparer, caught only after a benchmark failed in
      # #121) slip through a debug-only CI. Build only; nothing is executed
      # in release.
      - name: Build test targets in release
        if: inputs.release-compile
        # `swift build -c release --build-tests` is not a valid gate: it
        # fails on clean main with a pre-existing testability error
        # ("unable to resolve Swift module dependency to a compatible
        # module: 'RunPlayCore'"). `swift test -c release --filter` with a
        # deliberately non-matching pattern compiles every test target in
        # release and then runs zero tests — the compile is the check, so
        # the warning "No matching test cases were run" is expected and
        # harmless. Verified on clean main: with #121's `#if DEBUG` guards
        # reverted this command fails at `SyntheticWorkoutVideoMapPreparer`
        # not being in scope; with them present it passes.
        run: swift test --build-system swiftbuild -c release --filter RUNPLAY_CI_RELEASE_BUILD_COMPILE_ONLY

      # Every String Catalog must list exactly the strings its module's
      # source uses (no missing, no stale keys), each translated into zh-Hans
      # and zh-Hant with matching placeholders. When the full suite ran, the
      # check reads the extraction of the "Build all targets and tests" step,
      # so there is no second build. A caller without the full suite (it has
      # no shared build) gets the script's own build, in its own scratch path
      # (.build-localization), which never invalidates the shared .build.
      - name: Check String Catalogs
        if: inputs.localization
        env:
          FULL_TESTS: ${{ inputs.full-tests }}
        run: |
          set -euo pipefail
          if [[ "${FULL_TESTS}" == "true" ]]; then
            ./scripts/check-localization.sh --skip-build --scratch-path .build --stringsdata-dir "${RUNNER_TEMP}/stringsdata"
          else
            ./scripts/check-localization.sh
          fi
