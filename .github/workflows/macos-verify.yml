name: macOS verification

# Reusable macOS verification body, called by BOTH lanes so the PR lane and
# the Release lane can never drift apart:
#   - ci.yml      calls it per matrix leg (full-stack tests / release compile)
#   - release.yml calls it with every suite enabled before packaging
# Not triggered directly by any event.
#
# GitHub Actions constraint: a job that `uses:` a reusable workflow can
# declare only `name`, `uses`, `with`, `needs`, `if`, `permissions`,
# `strategy`, `concurrency`, and `secrets` — it cannot also have `steps`.
# That is why the matrix caller in ci.yml is a bare `uses:` job and why the
# suite toggles below exist: the caller selects work, this workflow owns
# the step sequence.

on:
  workflow_call:
    inputs:
      engine:
        description: "Run the C++ engine warning build and native engine tests."
        type: boolean
        default: true
      full-tests:
        description: "Run the full package test suite (swift test)."
        type: boolean
        default: true
      release-compile:
        description: "Compile every test target in release configuration."
        type: boolean
        default: false
      demo-assets:
        description: >-
          Check the committed README demo cards against the renderer
          (docs/demo-assets.md). Pair it with full-tests, whose debug build
          it reuses.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (macOS)
    runs-on: xcode-27
    steps:
      # A local action resolves from the workspace, so checkout must precede
      # the setup composite.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-macos-build

      - name: Validate C++ architecture boundaries
        run: ./scripts/validate-cpp-boundaries.sh

      # The Linux Core gate's log parser and the SwiftPM crash-retry
      # classifier it runs `swift test` through are shell + awk. The Linux
      # lane self-tests both on the image's mawk before trusting them; this
      # runs the same fixtures on BSD awk, which is what the docker/podman
      # modes parse with on a developer's Mac. /bin/bash pins the bash 3.2
      # every Mac ships, whatever bash comes first on PATH. Seconds, no
      # Swift build.
      - name: Self-test Linux log parsers (BSD awk, bash 3.2)
        run: |
          /bin/bash ./scripts/linux-container-verify.sh --self-test
          /bin/bash ./scripts/retry-swiftpm-libdispatch-crash.sh --self-test

      - name: Build RunPlayEngineCpp
        if: inputs.engine
        run: >-
          swift build --target RunPlayEngineCpp
          -Xcxx -Wall
          -Xcxx -Wextra
          -Xcxx -Wpedantic
          -Xcxx -Wconversion
          -Xcxx -Wsign-conversion
          -Xcxx -Wshadow

      - name: Run native C++ engine tests
        if: inputs.engine
        run: swift test --filter RunPlayEngineCppTests -Xswiftc -warnings-as-errors

      - name: Verify full package
        if: inputs.full-tests
        run: swift test -Xswiftc -warnings-as-errors

      # README drift gate: the summary cards committed in docs/assets/ must
      # match what the current renderer draws from the bundled synthetic
      # runs, within the pixel tolerance in DemoAssetImageComparison.swift,
      # and docs/assets/ must fit its size budget. It reuses the debug build
      # the suite above just made. The videos and GIFs are not compared:
      # their basemap is Apple's live map data. Only the CI lane turns this
      # on: it guards documentation, so a runner-image roll that changes text
      # rasterization must not block a release. /bin/bash pins the bash 3.2
      # every Mac ships, as in the self-test step above.
      - name: Check README demo assets
        if: inputs.demo-assets
        run: /bin/bash ./scripts/generate-demo-assets.sh --check --output-dir "${RUNNER_TEMP}/demo-asset-check"

      # The rendered cards and magenta diff images, for inspecting a drift
      # failure or refreshing docs/assets/ from this runner image.
      - name: Upload README demo asset drift evidence
        if: failure() && inputs.demo-assets
        uses: actions/upload-artifact@v7
        with:
          name: demo-asset-drift
          path: ${{ runner.temp }}/demo-asset-check
          if-no-files-found: ignore
          retention-days: 14

      # Release-mode compile check for every test target. Benchmark scripts
      # build tests in release, but no other suite compiles the test targets
      # in that configuration, so DEBUG-only test helpers (e.g. #101's
      # synthetic map preparer, caught only after a benchmark failed in
      # #121) slip through a debug-only CI. Build only; nothing is executed
      # in release.
      - name: Build test targets in release
        if: inputs.release-compile
        # `swift build -c release --build-tests` is not a valid gate: it
        # fails on clean main with a pre-existing testability error
        # ("unable to resolve Swift module dependency to a compatible
        # module: 'RunPlayCore'"). `swift test -c release --filter` with a
        # deliberately non-matching pattern compiles every test target in
        # release and then runs zero tests — the compile is the check, so
        # the warning "No matching test cases were run" is expected and
        # harmless. Verified on clean main: with #121's `#if DEBUG` guards
        # reverted this command fails at `SyntheticWorkoutVideoMapPreparer`
        # not being in scope; with them present it passes.
        run: swift test -c release --filter RUNPLAY_CI_RELEASE_BUILD_COMPILE_ONLY
