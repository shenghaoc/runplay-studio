name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: macOS (full app)
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Swift Package Describe
      run: swift package describe

    - name: Build
      run: swift build

    - name: Test
      run: swift test

  core-linux:
    name: RunPlayCore (Linux)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.9"

    - name: Swift Version
      run: swift --version

    - name: Build RunPlayCore
      run: swift build --target RunPlayCore

    - name: Test RunPlayCore
      run: swift test --filter RunPlayCoreTests
