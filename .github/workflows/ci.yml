name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # RunPlayCore: Pure Swift domain logic — test on Linux for cross-platform validation
  core-linux:
    name: RunPlayCore (Linux)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Verify Swift version
        run: swift --version
      - name: Build RunPlayCore
        run: swift build --target RunPlayCore
      - name: Test RunPlayCore
        run: swift test --filter RunPlayCoreTests

  # Full stack: macOS-only targets (RunPlayPlatform + RunPlayStudio)
  macos:
    name: macOS (Full Stack)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Build
        run: swift build
      - name: Test
        run: swift test
