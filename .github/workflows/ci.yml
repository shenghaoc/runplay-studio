name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # RunPlayCore + portable C++ engine — test on Linux for cross-platform validation
  core-linux:
    name: RunPlayCore (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify Swift 6.3
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.3'
      - name: Print Clang version
        run: |
          clang --version || true
          clang++ --version || true
      - name: Validate C++ architecture boundaries
        run: ./scripts/validate-cpp-boundaries.sh
      - name: Build RunPlayEngineCpp
        run: swift build --target RunPlayEngineCpp
      - name: Run native C++ engine tests
        run: ./scripts/run-cpp-engine-tests.sh
      - name: Verify RunPlayCore
        run: swift test --filter RunPlayCoreTests -Xswiftc -warnings-as-errors

  # AddressSanitizer + UndefinedBehaviorSanitizer on the native C++ test binary
  core-linux-sanitizers:
    name: RunPlayEngineCpp Sanitizers (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify Swift 6.3
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.3'
      - name: Native C++ tests under ASan + UBSan
        run: ./scripts/run-cpp-engine-tests.sh --sanitize

  # Full stack: macOS-only targets (RunPlayPlatform + RunPlayStudio) + C++ engine
  macos:
    name: macOS (Full Stack)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - name: Verify Swift 6.3
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.3'
      - name: Validate C++ architecture boundaries
        run: ./scripts/validate-cpp-boundaries.sh
      - name: Build RunPlayEngineCpp
        run: swift build --target RunPlayEngineCpp
      - name: Run native C++ engine tests
        run: ./scripts/run-cpp-engine-tests.sh
      - name: Verify full package
        run: swift test -Xswiftc -warnings-as-errors
