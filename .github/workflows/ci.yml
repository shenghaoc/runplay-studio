name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # RunPlayCore: Pure Swift domain logic — test on Linux for cross-platform validation
  core-linux:
    name: RunPlayCore (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.3'
      - name: Build RunPlayCore
        run: swift build --target RunPlayCore
      - name: Test RunPlayCore
        run: swift test --filter RunPlayCoreTests

  # RunPlayPlatform: macOS non-UI layer (SceneKit, AppKit, MapKit)
  platform-macos:
    name: RunPlayPlatform (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build RunPlayPlatform
        run: swift build --target RunPlayPlatform
      - name: Test RunPlayPlatform
        run: swift test --filter RunPlayPlatformTests

  # Full stack: macOS-only targets (RunPlayPlatform + RunPlayStudio)
  macos:
    name: macOS (Full Stack)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test
