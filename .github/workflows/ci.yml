name: CI

on:
  pull_request:
    branches: [main]
  # The nightly (nightly.yml) runs this exact lane on main through
  # workflow_call, so the PR lane has one definition, not a copy.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Keyed on the ref: each PR gets one group, so a superseded PR run cancels
  # instead of burning contended macOS runners. Only pull_request runs are
  # cancelled; when the nightly calls this workflow, github.event_name is the
  # caller's (schedule or workflow_dispatch), so a nightly run is never
  # cancelled by another.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects the lanes and macOS test targets this PR can affect, from the
  # paths it changes (scripts/ci-select-lanes.sh holds the table). It
  # diffs the PR's merge commit against the base commit, so on a stacked PR
  # the diff is against the parent PR's branch and the selection covers only
  # that PR's own changes; every PR below it is verified by its own CI.
  # Fail open: any event but pull_request (the nightly's workflow_call) and
  # any diff that cannot be read select everything.
  changes:
    name: Select affected lanes
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      linux: ${{ steps.select.outputs.linux }}
      macos: ${{ steps.select.outputs.macos }}
      macos_test_filter: ${{ steps.select.outputs.macos_test_filter }}
    steps:
      - uses: actions/checkout@v7
      - name: Select lanes from the changed paths
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            ./scripts/ci-select-lanes.sh --event "${EVENT_NAME}" < /dev/null | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the PR's merge commit, shallow. The diff needs
          # only the base commit's tree. --no-renames lists a renamed file's
          # old and new path, so both count.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}" || true
          fi
          if paths="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)"; then
            echo "changed paths:"
            printf '%s\n' "${paths}"
            printf '%s\n' "${paths}" | ./scripts/ci-select-lanes.sh --event pull_request | tee -a "$GITHUB_OUTPUT"
          else
            echo "could not diff against ${BASE_SHA}; running everything" >&2
            ./scripts/ci-select-lanes.sh --event unreadable < /dev/null | tee -a "$GITHUB_OUTPUT"
          fi

  # Free, runner-cheap lint lane: packaging script syntax, actionlint over
  # the workflows, and the selector's self-test. Always runs.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Packaging tooling syntax
        run: |
          # linux-container-verify, the SwiftPM crash-retry wrapper it
          # shares with the Linux lane, and the README demo-asset generator
          # are not packaging tooling, but the same syntax gate keeps them
          # from rotting.
          bash -n scripts/linux-container-verify.sh
          bash -n scripts/retry-swiftpm-libdispatch-crash.sh
          bash -n scripts/generate-demo-assets.sh
          bash -n scripts/ci-select-lanes.sh
          bash -n scripts/lib/release-common.sh
          bash -n scripts/assemble-app-bundle.sh
          bash -n scripts/package-demo.sh
          bash -n scripts/package-release.sh
          bash -n scripts/verify-app-bundle.sh
          bash -n scripts/test-release-packaging.sh
          bash -n script/build_and_run.sh
          # The localization check is not packaging tooling either, but it
          # gates the macOS lane; catch a syntax slip here for free.
          bash -n scripts/check-localization.sh
          python3 -m py_compile scripts/check-localization.py
      # actionlint is third-party tooling: pinned by exact version with the
      # published tarball checksum verified, never a floating tag.
      - name: Install actionlint (pinned)
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c
          tar xzf actionlint.tar.gz actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color
      # The lane selector decides what a PR skips, so its self-test runs on
      # every PR, whatever the selector itself selected.
      - name: Self-test the lane selector
        run: ./scripts/ci-select-lanes.sh --self-test

  # Full stack: macOS-only targets (RunPlayPlatform + RunPlayStudio) + C++
  # engine, in one call of the reusable macOS verification workflow (the same
  # one the Release lane and the nightly call). macOS runners are the
  # bottleneck (about two run at once), so a PR pays for at most one macOS
  # job, and only when a changed path can reach it. The release-mode test
  # compile is not here: nothing in a typical PR can break it, and the nightly
  # (nightly.yml) and the Release workflow check it. Release packaging is not
  # here or in the nightly: the Release workflow (release.yml) verifies it. The
  # README media tool is not in CI at all.
  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/macos-verify.yml
    with:
      engine: true
      full-tests: true
      release-compile: false
      localization: true
      test-filter: ${{ needs.changes.outputs.macos_test_filter }}

  # RunPlayCore + portable C++ engine — test on Linux for cross-platform
  # validation. Linux CI is container-only by policy: every Linux job that
  # needs Swift runs the one official Swift image pinned below (Swift
  # 6.3.3, the version Xcode 26.6 bundles), so the tag lives in exactly one
  # place and bumping it is a one-line change. The ubuntu-26.04 host
  # contributes only the kernel and the Docker daemon; nothing from the
  # runner image exists inside the container, which is why the explicit
  # python3 install below is required (validate-cpp-boundaries.sh drives
  # its AST checks with it) — do not remove it. The digest pins the exact
  # image manifest; refresh it together with the tag on every bump.
  # Dependabot cannot track this (its github-actions ecosystem only
  # updates `uses:`); Renovate can, via a regex manager anchored here.
  # Both suites (tests and ASan+UBSan sanitizers) share this one job so
  # the image pin stays single-sourced; the matrix keeps them as separate
  # parallel checks.
  core-linux:
    name: RunPlayCore (Linux, ${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.linux == 'true' || needs.changes.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [tests, sanitizers]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Every `run:` step in this job uses bash. GitHub Actions defaults
    # container-job steps to the image's default shell, which for the
    # official Swift image is POSIX sh (dash): there `[[ ]]` is a
    # not-found no-op inside an `if` (so the test silently evaluates
    # false and the step passes vacuously — the exact failure mode that
    # went undetected here for months), and `${var:offset:length}` is a
    # bad substitution. (`${var##pattern}` is ordinary POSIX parameter
    # expansion and is fine in dash.) Bash is present in the image
    # (5.3.9), so setting it at the job level makes every step's shell
    # explicit and prevents a future step from silently inheriting sh.
    # Per-step `shell:` keys must not appear in this job; a step-level
    # omission must not change semantics.
    defaults:
      run:
        shell: bash
    # Single source of truth for the Linux Swift toolchain. Two readers
    # parse this line's exact text, both by this file's path: this job's
    # "Record Swift toolchain identity" step, and
    # scripts/linux-container-verify.sh — the local-verification
    # entrypoint the AGENTS.md recipe invokes — which reads the line by its
    # `container:` key (then checks the @sha256: shape). Do not reformat
    # this line; keep the shape
    # `swift:<major>.<minor>.<patch>[-<codename>]@sha256:<digest>`.
    # Bumping the image means editing this line and refreshing the digest
    # in the same change.
    #
    # Keep the Swift version in this image equal to the Swift in the Xcode
    # selected in .github/actions/setup-macos-build/action.yml; bump both in
    # the same change.
    container: swift:6.3.3@sha256:4f42306306fe7e5a773a8d47d7e2a24dc3a975d1feb77996297ecfd7c329b1e9
    steps:
      # The tests leg always runs the boundary validator, which needs the
      # checkout; every other step, and the whole sanitizers leg, runs only
      # when a change can reach RunPlayCore on Linux (linux is on).
      - uses: actions/checkout@v7
        if: matrix.suite == 'tests' || needs.changes.outputs.linux == 'true'
      - name: Record Swift toolchain identity
        if: needs.changes.outputs.linux == 'true'
        id: toolchain
        run: |
          set -euo pipefail
          VERSION="$(swift --version | grep -oE 'Swift version [0-9]+(\.[0-9]+)+' | head -n1 | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n1)"
          if [[ -z "${VERSION}" ]]; then
            echo "could not read a Swift marketing version from 'swift --version'" >&2
            swift --version >&2 || true
            exit 1
          fi
          # The exact Linux toolchain identity is already pinned: the
          # container's @sha256: digest. Read it from the `container:` line
          # itself — this file must not carry a second copy of the pin. The
          # full digit+digest shape is required in the pattern so the
          # shape-documenting comment above that line cannot be picked up
          # instead.
          PIN="$(grep -oE 'container:[[:space:]]*swift:[0-9]+(\.[0-9]+)+(-[a-z]+)?@sha256:[0-9a-f]+' .github/workflows/ci.yml | head -n1)"
          DIGEST="${PIN##*@sha256:}"
          if [[ -z "${DIGEST}" || "${DIGEST}" == "${PIN}" ]]; then
            echo "could not read the container digest from .github/workflows/ci.yml" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "id=${DIGEST:0:12}" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM dependency cache
        if: needs.changes.outputs.linux == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.id }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.id }}-spm-
      # The image is minimal and nothing from the runner exists inside it;
      # validate-cpp-boundaries.sh drives its AST checks with python3 and
      # clang++ (in the image). The validator is a static source check over
      # Core, Platform and Studio, so it runs in the tests leg whenever the
      # job runs, including for a Studio-only PR that skips the Linux steps.
      - name: Install container dependencies
        if: matrix.suite == 'tests'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3
      - name: Validate C++ architecture boundaries
        if: matrix.suite == 'tests'
        run: ./scripts/validate-cpp-boundaries.sh
      - name: Print Swift version
        if: needs.changes.outputs.linux == 'true'
        run: swift --version
      - name: Print Clang version
        if: needs.changes.outputs.linux == 'true'
        run: |
          clang --version || true
          clang++ --version || true
      # SwiftPM itself can segfault in libdispatch while it plans a build
      # (#199), so every SwiftPM build below — the Core gate's `swift test`
      # too, inside linux-container-verify.sh — runs through
      # retry-swiftpm-libdispatch-crash.sh. It reruns a command once for
      # exactly that crash, and only while SwiftPM has reported no error and
      # not finished the build, so a reported build error or any test result
      # is final. Its classifier is shell + awk: self-test it on the image's
      # mawk first.
      - name: Self-test SwiftPM crash retry
        if: needs.changes.outputs.linux == 'true'
        run: ./scripts/retry-swiftpm-libdispatch-crash.sh --self-test
      - name: Build RunPlayEngineCpp
        if: needs.changes.outputs.linux == 'true'
        run: >-
          ./scripts/retry-swiftpm-libdispatch-crash.sh
          swift build --target RunPlayEngineCpp
          -Xcxx -Wall
          -Xcxx -Wextra
          -Xcxx -Wpedantic
          -Xcxx -Wconversion
          -Xcxx -Wsign-conversion
          -Xcxx -Wshadow
      - name: Run native C++ engine tests
        if: (matrix.suite == 'tests') && needs.changes.outputs.linux == 'true'
        run: >-
          ./scripts/retry-swiftpm-libdispatch-crash.sh
          swift test --filter RunPlayEngineCppTests
      - name: Native C++ tests under ASan + UBSan
        if: (matrix.suite == 'sanitizers') && needs.changes.outputs.linux == 'true'
        run: ./scripts/run-cpp-engine-tests.sh --sanitize
      # The Core gate is the script, not a bare `swift test`: a bare run exits
      # 0 however many tests skipped, so only the script's skip-reason
      # allowlist and executed-test floor turn a mass skip into a failure.
      # It runs non-root so CI measures what a developer's container run
      # measures: this job's container is root (the python3 install above
      # needs it), and root bypasses POSIX permission bits, which makes
      # testFailedWorkoutWritePreservesPriorValidData skip. The step hands
      # the checkout to an unprivileged uid, drops to it with setpriv
      # (util-linux, in the image), and hands the tree back so the steps
      # below keep running as root on a root-owned tree. 1001 is only an
      # unused uid; it needs no passwd entry because the script sets HOME.
      - name: Verify RunPlayCore (non-root, skip allowlist and floor)
        if: (matrix.suite == 'tests') && needs.changes.outputs.linux == 'true'
        run: |
          set -euo pipefail
          chown -R 1001:1001 .
          status=0
          setpriv --reuid=1001 --regid=1001 --clear-groups -- \
            ./scripts/linux-container-verify.sh native || status=$?
          chown -R 0:0 .
          exit "${status}"
      # Building alone would not exercise the smoke test's runtime
      # `precondition`s, so run the binary as well.
      - name: Verify external RunPlayCore consumer
        if: (matrix.suite == 'tests') && needs.changes.outputs.linux == 'true'
        run: |
          ./scripts/retry-swiftpm-libdispatch-crash.sh swift build --package-path Tests/PackageConsumerSmoke
          ./scripts/retry-swiftpm-libdispatch-crash.sh swift run --package-path Tests/PackageConsumerSmoke RunPlayCoreConsumerSmoke
      # Mirrors the Release Packaging job's end-of-job assertion. Every
      # Swift-invoking step above may only write under ignored paths
      # (.build/, Tests/PackageConsumerSmoke/.build/, the ignored smoke
      # lockfile); anything else — e.g. an unexpected lockfile or other
      # resolver-written file — must fail the job instead of hiding in an
      # ephemeral runner. Gated to the tests suite, the leg whose steps
      # mutate the workspace beyond the engine build tree.
      - name: Fail on workspace dirtiness
        if: (matrix.suite == 'tests') && needs.changes.outputs.linux == 'true'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "job left the workspace dirty:" >&2
            git status --porcelain >&2
            exit 1
          fi

  # The single status check branch protection requires. Every verification
  # lane MUST appear in `needs:` below AND in the checks inside the gate
  # script: this job is the only thing branch protection looks at, so a lane
  # accidentally dropped from needs: must leave the gate red, not silently
  # green.
  #
  # `changes` and `lint` must report `success`. The selected lanes (macos and
  # core-linux) may report `skipped` ONLY when `changes` said that lane is
  # off. core-linux runs when linux OR macos is on (it carries the C++
  # boundary validator, which Studio-only PRs need), so it may be skipped
  # only when both are off: a skip is accepted when it was planned. When `changes` said
  # a lane is on, only `success` passes, so a skip from a changed condition,
  # an unset needs: output or a mis-wired job leaves the gate red. `failure`,
  # `cancelled` and a missing result always fail.
  gate:
    name: CI
    needs: [changes, lint, macos, core-linux]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check every lane
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          result_of() {
            printf '%s' "${NEEDS}" | jq -r --arg lane "$1" '.[$lane].result // ""'
          }
          bug() {
            echo "GATE BUG: lane '$1' did not report a result." >&2
            echo "It is missing from this job's needs: — branch protection would stay" >&2
            echo "green without it. Restore the needs: entry, or, if the lane was" >&2
            echo "deliberately removed, update this list in the same change." >&2
            failed=1
          }
          for lane in changes lint; do
            result="$(result_of "${lane}")"
            case "${result}" in
              success) echo "lane ${lane}: ${result}" ;;
              "") bug "${lane}" ;;
              *)
                echo "lane ${lane}: ${result} — must succeed" >&2
                failed=1
                ;;
            esac
          done
          # lane:selector-output pairs; core-linux runs when linux OR macos
          # is on, so its "selected" value is "true" if either is.
          for pair in macos:macos core-linux:either; do
            lane="${pair%%:*}"
            key="${pair##*:}"
            result="$(result_of "${lane}")"
            if [[ "${key}" == "either" ]]; then
              linux="$(printf '%s' "${NEEDS}" | jq -r '.changes.outputs.linux // ""')"
              macos="$(printf '%s' "${NEEDS}" | jq -r '.changes.outputs.macos // ""')"
              if [[ "${linux}" == "false" && "${macos}" == "false" ]]; then
                selected="false"
              elif [[ "${linux}" == "true" || "${macos}" == "true" ]]; then
                selected="true"
              else
                selected=""
              fi
            else
              selected="$(printf '%s' "${NEEDS}" | jq -r --arg key "${key}" '.changes.outputs[$key] // ""')"
            fi
            case "${result}" in
              success) echo "lane ${lane}: ${result}" ;;
              skipped)
                if [[ "${selected}" == "false" ]]; then
                  echo "lane ${lane}: skipped (the selector turned it off; accepted)"
                else
                  echo "lane ${lane}: skipped, but the selector said '${selected}' — a planned skip is the only skip accepted" >&2
                  failed=1
                fi
                ;;
              "") bug "${lane}" ;;
              *)
                echo "lane ${lane}: ${result} — treating as failure" >&2
                failed=1
                ;;
            esac
          done
          exit "${failed}"
