name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keyed on the ref: each PR and the main branch get one group, so a
  # superseded PR run cancels instead of burning contended macOS runners.
  # Superseded main-push runs are deliberately NOT cancelled: the packaging
  # lane runs unconditionally on push, and cancelling a merged commit's run
  # would let that commit skip packaging verification permanently.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Packaging-relevant change detection for the pull_request event. The
  # packaging lane below runs on every push to main but only on PRs whose
  # diff touches something that can actually break packaging; typical
  # Swift/C++ PRs skip it. Never filter the whole workflow on paths — the
  # gate job must always run so branch protection sees "CI".
  changes:
    name: Detect packaging-relevant changes
    runs-on: ubuntu-26.04
    outputs:
      packaging: ${{ steps.detect.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect packaging-relevant paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            # push (and any future trigger): the packaging lane runs unconditionally.
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi
          # Paths that can break packaging: the packaging scripts themselves,
          # the package manifest and lockfile, the Info.plist bundle template,
          # the release workflow, this workflow (an edit to the packaging job
          # itself must run it), every local composite action, and VERSION —
          # the packaging job reads it and asserts the versioned zip name, so
          # a version bump is precisely a packaging-relevant change.
          # Keep this list in sync with the packaging-macos job comment below
          # and with docs/releasing.md (three sites; edit them together).
          if git diff --name-only "${BASE_SHA}..HEAD" | grep -qE \
            '^(scripts/|script/|Packaging/|Package\.swift$|Package\.resolved$|VERSION$|\.github/workflows/(release|ci)\.yml$|\.github/actions/)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  # Free, runner-cheap lint lane: packaging script syntax plus actionlint
  # over the workflows. Runs on every PR and every main push.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Packaging tooling syntax
        run: |
          bash -n scripts/lib/release-common.sh
          bash -n scripts/assemble-app-bundle.sh
          bash -n scripts/package-demo.sh
          bash -n scripts/package-release.sh
          bash -n scripts/verify-app-bundle.sh
          bash -n scripts/test-release-packaging.sh
          bash -n script/build_and_run.sh
      # actionlint is third-party tooling: pinned by exact version with the
      # published tarball checksum verified, never a floating tag.
      - name: Install actionlint (pinned)
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c
          tar xzf actionlint.tar.gz actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color

  # Full stack: macOS-only targets (RunPlayPlatform + RunPlayStudio) + C++
  # engine, split into parallel matrix legs that all share the reusable
  # macOS verification workflow (the same one the Release lane calls).
  # Sharding beyond these two legs is deliberately not done: observed
  # xcode-27 concurrency is ~2 jobs at a time, so more legs would queue
  # instead of parallelize.
  macos-matrix:
    name: macOS (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: full-tests
            engine: true
            full-tests: true
            release-compile: false
          - suite: release-compile
            engine: false
            full-tests: false
            release-compile: true
    uses: ./.github/workflows/macos-verify.yml
    with:
      engine: ${{ matrix.engine }}
      full-tests: ${{ matrix.full-tests }}
      release-compile: ${{ matrix.release-compile }}

  # RunPlayCore + portable C++ engine — test on Linux for cross-platform
  # validation. Linux CI is container-only by policy: every Linux job that
  # needs Swift runs the one official Swift image pinned below (Ubuntu
  # 26.04 "resolute" userspace, Swift 6.4), so the tag lives in exactly one
  # place and bumping it is a one-line change. The ubuntu-26.04 host
  # contributes only the kernel and the Docker daemon; nothing from the
  # runner image exists inside the container, which is why the explicit
  # python3 install below is required (validate-cpp-boundaries.sh drives
  # its AST checks with it) — do not remove it. The digest pins the exact
  # image manifest; refresh it together with the tag on every bump.
  # Dependabot cannot track this (its github-actions ecosystem only
  # updates `uses:`); Renovate can, via a regex manager anchored here.
  # Both suites (tests and ASan+UBSan sanitizers) share this one job so
  # the image pin stays single-sourced; the matrix keeps them as separate
  # parallel checks.
  core-linux:
    name: RunPlayCore (Linux, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [tests, sanitizers]
    runs-on: ubuntu-26.04
    # Every `run:` step in this job uses bash. GitHub Actions defaults
    # container-job steps to the image's default shell, which for the
    # official Swift image is POSIX sh (dash): there `[[ ]]` is a
    # not-found no-op inside an `if` (so the test silently evaluates
    # false and the step passes vacuously — the exact failure mode that
    # went undetected here for months), and `${var:offset:length}` is a
    # bad substitution. (`${var##pattern}` is ordinary POSIX parameter
    # expansion and is fine in dash.) Bash is present in the image
    # (5.3.9), so setting it at the job level makes every step's shell
    # explicit and prevents a future step from silently inheriting sh.
    # Per-step `shell:` keys must not appear in this job; a step-level
    # omission must not change semantics.
    defaults:
      run:
        shell: bash
    # Single source of truth for the Linux Swift toolchain. Its exact text
    # is parsed by scripts/check-toolchain-parity.sh, and the AGENTS.md
    # local-verification recipe reads this line by its `container:` key
    # (then checks the @sha256: shape), so do not reformat this line;
    # keep the shape `swift:<major>.<minor>.<patch>-<codename>@sha256:<digest>`.
    # Bumping the image means editing this line and refreshing the digest
    # in the same change.
    #
    # TODO(ci): check-toolchain-parity.sh greps THIS file by path for the
    # container image pin below, and this job's "Record Swift toolchain
    # identity" step greps it too. Moving this Linux lane into its own
    # workflow file later requires updating that script, that step, and the
    # AGENTS.md recipe first, or every parity check fails with "no pin
    # found".
    container: swift:6.4.0-resolute@sha256:bb6e5d5f2a97bc07cf8022c1a3e062f8164b8fd078698327ce2ab097e02a91dc
    steps:
      - uses: actions/checkout@v7
      - name: Record Swift toolchain identity
        id: toolchain
        run: |
          set -euo pipefail
          VERSION="$(swift --version | grep -oE 'Swift version [0-9]+(\.[0-9]+)+' | head -n1 | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n1)"
          if [[ -z "${VERSION}" ]]; then
            echo "could not read a Swift marketing version from 'swift --version'" >&2
            swift --version >&2 || true
            exit 1
          fi
          # The exact Linux toolchain identity is already pinned: the
          # container's @sha256: digest. Read it from the same line
          # check-toolchain-parity.sh parses — this file must not carry a
          # second copy of the pin. The full digit+digest shape is required
          # in the pattern so the `container: swift:...` placeholder in the
          # TODO comment below cannot be picked up instead.
          PIN="$(grep -oE 'container:[[:space:]]*swift:[0-9]+(\.[0-9]+)+-[a-z]+@sha256:[0-9a-f]+' .github/workflows/ci.yml | head -n1)"
          DIGEST="${PIN##*@sha256:}"
          if [[ -z "${DIGEST}" || "${DIGEST}" == "${PIN}" ]]; then
            echo "could not read the container digest from .github/workflows/ci.yml" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "id=${DIGEST:0:12}" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM dependency cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.id }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.id }}-spm-
      - name: Install container dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3
      - name: Verify Swift toolchain parity
        run: |
          swift --version
          ./scripts/check-toolchain-parity.sh
      - name: Print Clang version
        run: |
          clang --version || true
          clang++ --version || true
      - name: Validate C++ architecture boundaries
        run: ./scripts/validate-cpp-boundaries.sh
      - name: Build RunPlayEngineCpp
        run: >-
          swift build --target RunPlayEngineCpp
          -Xcxx -Wall
          -Xcxx -Wextra
          -Xcxx -Wpedantic
          -Xcxx -Wconversion
          -Xcxx -Wsign-conversion
          -Xcxx -Wshadow
      - name: Run native C++ engine tests
        if: matrix.suite == 'tests'
        run: swift test --filter RunPlayEngineCppTests -Xswiftc -warnings-as-errors
      - name: Native C++ tests under ASan + UBSan
        if: matrix.suite == 'sanitizers'
        run: ./scripts/run-cpp-engine-tests.sh --sanitize
      - name: Verify RunPlayCore
        if: matrix.suite == 'tests'
        run: swift test --filter RunPlayCoreTests -Xswiftc -warnings-as-errors
      # Building alone would not exercise the smoke test's runtime
      # `precondition`s, so run the binary as well.
      - name: Verify external RunPlayCore consumer
        if: matrix.suite == 'tests'
        run: |
          swift build --package-path Tests/PackageConsumerSmoke
          swift run --package-path Tests/PackageConsumerSmoke RunPlayCoreConsumerSmoke
      # Mirrors the Release Packaging job's end-of-job assertion. Every
      # Swift-invoking step above may only write under ignored paths
      # (.build/, Tests/PackageConsumerSmoke/.build/, the ignored smoke
      # lockfile); anything else — e.g. an unexpected lockfile or other
      # resolver-written file — must fail the job instead of hiding in an
      # ephemeral runner. Gated to the tests suite, the leg whose steps
      # mutate the workspace beyond the engine build tree.
      - name: Fail on workspace dirtiness
        if: matrix.suite == 'tests'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "job left the workspace dirty:" >&2
            git status --porcelain >&2
            exit 1
          fi

  # Release packaging: script contracts plus a real end-to-end build of both
  # credential-free artifacts. On pull requests this lane is path-filtered
  # (see the changes job): only PRs that touch the packaging scripts
  # (scripts/**, script/**), the package manifest and lockfile
  # (Package.swift, Package.resolved), the Info.plist bundle template
  # (Packaging/**), VERSION, the release or CI workflow (release.yml,
  # ci.yml), or any local composite action under .github/actions/ pay for
  # it. On push to main it runs unconditionally, so every merged commit is
  # packaging-verified before any tag exists.
  # Keep this list in sync with the changes-job comment above and with
  # docs/releasing.md (three sites; edit them together).
  # Credential-free by construction: no signing identity, no notarization,
  # no GitHub Release.
  packaging-macos:
    name: Release Packaging (macOS)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.packaging == 'true'
    runs-on: xcode-27
    steps:
      # A local action resolves from the workspace, so checkout must precede
      # the setup composite.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-macos-build
      - name: Packaging contract tests
        run: ./scripts/test-release-packaging.sh
      - name: Unsigned demo package (end to end)
        run: ./scripts/package-demo.sh "${RUNNER_TEMP}/demo-artifacts"
      - name: Ad-hoc dry-run release package (end to end)
        # Byte-for-byte the invocation the Release workflow runs on its
        # non-production path, so a regression there fails here instead.
        run: >-
          ./scripts/package-release.sh
          --signing-mode adhoc
          --skip-notarization
          --dry-run
          --build-number "${GITHUB_RUN_NUMBER}"
          --output-dir "${RUNNER_TEMP}/release-artifacts"
      - name: Verify produced artifacts
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          DEMO="${RUNNER_TEMP}/demo-artifacts"
          RELEASE="${RUNNER_TEMP}/release-artifacts"
          test -d "${DEMO}/RunPlayStudio.app"
          test -f "${DEMO}/RunPlayStudio.app.zip"
          test -f "${RELEASE}/RunPlayStudio-${VERSION}-macos-arm64.zip"
          test -f "${RELEASE}/RunPlayStudio-${VERSION}-release.json"
          (cd "${RELEASE}" && shasum -a 256 -c SHA256SUMS)
          # Production packaging refuses to run against a dirty checkout, so
          # packaging must never write into the working tree itself.
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "packaging dirtied the working tree:" >&2
            git status --porcelain >&2
            exit 1
          fi

  # The single status check branch protection requires. Every verification
  # lane MUST appear in `needs:` below AND in the expected-lanes list inside
  # the gate script: this job is the only thing branch protection looks at,
  # so a lane accidentally dropped from needs: must leave the gate red, not
  # silently green.
  #
  # `skipped` is accepted for packaging-macos ONLY — that lane is
  # path-filtered on pull requests, so a skip is the designed fast path. For
  # every other lane a skip is a failure: they have no path filter, so a
  # skip means a changed condition, an unset needs: output, or a mis-wired
  # job, and the gate must not report green for a lane that never ran.
  # `cancelled` is a failure everywhere.
  gate:
    name: CI
    needs: [changes, lint, macos-matrix, core-linux, packaging-macos]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check every lane
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          for lane in changes lint macos-matrix core-linux packaging-macos; do
            result="$(printf '%s' "${NEEDS}" | jq -r --arg lane "${lane}" '.[$lane].result // ""')"
            case "${result}" in
              success)
                echo "lane ${lane}: ${result}"
                ;;
              skipped)
                if [[ "${lane}" == "packaging-macos" ]]; then
                  echo "lane ${lane}: ${result} (path-filtered on pull requests — accepted)"
                else
                  echo "lane ${lane}: ${result} — this lane has no path filter; a skip is a failure" >&2
                  failed=1
                fi
                ;;
              "")
                echo "GATE BUG: lane '${lane}' did not report a result." >&2
                echo "It is missing from this job's needs: — branch protection would stay" >&2
                echo "green without it. Restore the needs: entry, or, if the lane was" >&2
                echo "deliberately removed, update this list in the same change." >&2
                failed=1
                ;;
              *)
                echo "lane ${lane}: ${result} — treating as failure" >&2
                failed=1
                ;;
            esac
          done
          exit "${failed}"
