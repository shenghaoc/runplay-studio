name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # RunPlayCore: Pure Swift domain logic — test on Linux for cross-platform validation
  core-linux:
    name: RunPlayCore (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify Swift 6.3
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.3'
      - name: Verify agent repository configuration
        run: ./scripts/verify.sh agent-config
      - name: Verify RunPlayCore
        run: ./scripts/verify.sh core

  # Full stack: macOS-only targets (RunPlayPlatform + RunPlayStudio)
  macos:
    name: macOS (Full Stack)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - name: Verify Swift 6.3
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.3'
      - name: Verify full package
        run: ./scripts/verify.sh full
