name: Package Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Dispatch-only workflow: a repeated dispatch on the same ref supersedes
  # the previous run instead of stacking another macOS job behind it.
  group: package-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build demo .app artifact
    runs-on: xcode-27

    steps:
    - uses: ./.github/actions/setup-macos-build

    - name: Build and package
      run: ./scripts/package-demo.sh .build/artifacts

    - name: Upload demo app
      uses: actions/upload-artifact@v7
      with:
        name: RunPlayStudio-demo-app
        path: .build/artifacts/RunPlayStudio.app.zip
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
