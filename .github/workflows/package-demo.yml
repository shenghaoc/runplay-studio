name: Package Demo

on:
  workflow_dispatch: {}

jobs:
  package:
    name: Build demo .app artifact
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build and package
      run: ./scripts/package-demo.sh .build/artifacts

    - name: Upload demo app
      uses: actions/upload-artifact@v4
      with:
        name: RunPlayStudio-demo-app
        path: .build/artifacts/RunPlayStudio.app.zip
        retention-days: 30
        if-no-files-found: error
