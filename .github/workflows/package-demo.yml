name: Package Demo

on:
  workflow_dispatch:

jobs:
  package:
    name: Build demo .app artifact
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4

    - name: Build and package
      run: ./scripts/package-demo.sh .build/artifacts

    - name: Upload demo app
      uses: actions/upload-artifact@v4
      with:
        name: RunPlayStudio-demo-app
        path: .build/artifacts/RunPlayStudio.app.zip
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
