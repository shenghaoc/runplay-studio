name: Package Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build demo .app artifact
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7

    - name: Verify Swift toolchain parity
      run: |
        xcodebuild -version
        swift --version
        ./scripts/check-toolchain-parity.sh

    - name: Build and package
      run: ./scripts/package-demo.sh .build/artifacts

    - name: Upload demo app
      uses: actions/upload-artifact@v7
      with:
        name: RunPlayStudio-demo-app
        path: .build/artifacts/RunPlayStudio.app.zip
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
