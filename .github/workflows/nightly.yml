name: Nightly

# What a pull request is not worth a macOS runner for, run on main once a
# night (only when main moved since the last green nightly):
#   - pr-lane         the exact PR lane, by calling ci.yml (no copy)
#   - release-compile every test target compiled in release configuration
# Packaging is not here: the Release workflow (release.yml) verifies it, and a
# dry run of it on the tag commit is the pre-tag check (docs/releasing.md).
# A failure is reported by GitHub's default scheduled-run email; nothing here
# writes to the repository or opens issues. Scheduled workflows run on the
# default branch only.

on:
  schedule:
    # Off-peak and off the hour, when scheduled runs are least delayed.
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # freshness lists this workflow's previous runs.
  actions: read

concurrency:
  # One nightly per ref, and a running nightly is never cancelled: a
  # cancelled run would leave main with no green nightly to point a tag at.
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Skip the whole nightly when main has not moved since the last successful
  # one. A manual dispatch always runs. If the lookup fails the nightly runs
  # anyway: a wasted run is cheaper than a silent skip.
  freshness:
    name: Detect new commits
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Compare main with the last successful nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! LAST_SHA="$(gh api             "repos/${REPO}/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1"             --jq '.workflow_runs[0].head_sha // ""')"; then
            echo "could not read the last successful nightly; running anyway" >&2
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${LAST_SHA}" && "${LAST_SHA}" == "${CURRENT_SHA}" ]]; then
            echo "main is still at ${CURRENT_SHA}, already verified by a green nightly; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The whole PR lane (lint, RunPlayCore on Linux, the macOS job, the CI
  # gate), by calling the workflow a pull request runs.
  pr-lane:
    name: PR lane
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml

  # The release-mode compile of every test target. Engine and full tests are
  # off explicitly: the PR lane above already ran them, and macos-verify.yml
  # defaults both to on.
  release-compile:
    name: Release compile
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    uses: ./.github/workflows/macos-verify.yml
    with:
      engine: false
      full-tests: false
      release-compile: true
